name: Validate Nigerian fintech detectors

on:
  push:
    branches:
      - "validation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Check Go formatting
        run: |
          gofmt -d pkg/common/http_verify.go pkg/common/http_verify_test.go pkg/detectors/flutterwave/flutterwave.go pkg/detectors/flutterwave/flutterwave_test.go pkg/detectors/paystack/paystack.go pkg/detectors/paystack/paystack_test.go
          test -z "$(gofmt -l pkg/common/http_verify.go pkg/common/http_verify_test.go pkg/detectors/flutterwave/flutterwave.go pkg/detectors/flutterwave/flutterwave_test.go pkg/detectors/paystack/paystack.go pkg/detectors/paystack/paystack_test.go)"
      - name: Test shared bearer verification
        run: go test ./pkg/common -run TestVerifyBearerToken -count=1
      - name: Test Flutterwave detector
        run: go test ./pkg/detectors/flutterwave -tags=detectors -run 'TestFlutterWave_Pattern|TestFlutterwaveVerificationUsesInjectedClient' -count=1
      - name: Test Paystack detector
        run: go test ./pkg/detectors/paystack -tags=detectors -run 'TestPaystack_Pattern|TestPaystackVerificationUsesInjectedClient' -count=1
