name: Validate Nigerian fintech detectors

on:
  push:
    branches:
      - "validation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Test Flutterwave detector
        run: go test ./pkg/detectors/flutterwave -tags=detectors -run 'TestFlutterWave_Pattern|TestVerifyFlutterwave'
      - name: Test Paystack detector
        run: go test ./pkg/detectors/paystack -tags=detectors -run 'TestPaystack_Pattern|TestVerifyPaystack'
